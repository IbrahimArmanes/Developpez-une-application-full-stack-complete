# Database Configuration
spring.application.name=projet6
spring.datasource.url=jdbc:mysql://localhost:3306/projet6oc
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=none
# spring.jpa.show-sql=true
# server.port=${SERVER_PORT:3001}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#la ligne suivante est à commenter pour le premier lancement de l'application
spring.sql.init.mode=always 


# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=YourSecretKeyHereMakeSureItIsAtLeast32CharactersLong
app.jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
