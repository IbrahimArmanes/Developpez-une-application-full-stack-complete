<div class="home-container">
  <div class="logo-container">
    <img src="/assets/logo_p6.png" alt="Logo MDD" class="logo">
  </div>

  <div class="button-container">

    <!-- Show Login/Register buttons if NOT logged in -->
    <ng-container *ngIf="!authService.isLoggedIn()">
      <button mat-stroked-button color="primary" routerLink="/login" class="home-button">
        Se connecter
      </button>
      <button mat-stroked-button color="primary" routerLink="/register" class="home-button">
        S'inscrire
      </button>
    </ng-container>

    <!-- Show Logout button if logged in -->
    <ng-container *ngIf="authService.isLoggedIn()">
      <button mat-stroked-button color="warn" (click)="logout()" class="home-button">
        Se déconnecter
      </button>
      <!-- You could also add buttons here to navigate to protected areas -->
      <!-- e.g., <button mat-stroked-button color="primary" routerLink="/profile">Mon Profil</button> -->
    </ng-container>

  </div>
</div>
