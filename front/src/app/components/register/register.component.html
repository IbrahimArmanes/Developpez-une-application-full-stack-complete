<div class="register-container">
  <!-- Back Button -->
  <button mat-icon-button class="back-button" aria-label="Go back" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <!-- Desktop Logo Header -->
  <div class="desktop-header">
    <div class="logo-container-desktop">
      <img src="/assets/logo_p6.png" alt="MDD Logo" class="logo-desktop">
    </div>
  </div>

  <div class="form-wrapper">
    <!-- Logo (Visible on Mobile) -->
    <div class="logo-container-mobile">
      <img src="/assets/logo_p6.png" alt="MDD Logo" class="logo-mobile">
    </div>

    <!-- Title -->
    <h2 class="title">Inscription</h2>

    <!-- Registration Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <!-- Rest of the form remains unchanged -->
      <!-- Username Field -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Nom d'utilisateur</mat-label>
        <input matInput formControlName="username" required>
        <mat-error *ngIf="registerForm.get('username')?.invalid">
          {{ getUsernameErrorMessage() }}
        </mat-error>
      </mat-form-field>

      <!-- Email Field -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Adresse e-mail</mat-label>
        <input matInput formControlName="email" type="email" required>
        <mat-error *ngIf="registerForm.get('email')?.invalid">
          {{ getEmailErrorMessage() }}
        </mat-error>
      </mat-form-field>

      <!-- Password Field -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Mot de passe</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword" type="button">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-error *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          {{ getPasswordErrorMessage() }}
        </mat-error>
         <!-- Optional: Add hint for password requirements -->
        <mat-hint *ngIf="!registerForm.get('password')?.hasError('passwordStrength') && !registerForm.get('password')?.hasError('minlength') && registerForm.get('password')?.untouched">
          Min 8 chars, upper, lower, number, special char.
        </mat-hint>
      </mat-form-field>

      <!-- Submit Button -->
      <button mat-raised-button color="primary" type="submit" class="submit-button" [disabled]="registerForm.invalid || isSubmitting">
        <span *ngIf="!isSubmitting">S'inscrire</span>
        <mat-spinner *ngIf="isSubmitting" diameter="24" color="accent"></mat-spinner>
      </button>
    </form>
  </div>
</div>
