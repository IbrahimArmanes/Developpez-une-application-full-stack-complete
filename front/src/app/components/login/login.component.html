<div class="login-container">
  <!-- Back Button -->
  <button mat-icon-button class="back-button" aria-label="Go back" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <!-- Desktop Logo Header -->
  <div class="desktop-header">
    <div class="logo-container-desktop">
      <img src="/assets/logo_p6.png" alt="MDD Logo" class="logo-desktop">
    </div>
  </div>

  <div class="form-wrapper">
    <!-- Logo (Visible on Mobile) -->
    <div class="logo-container-mobile">
      <img src="/assets/logo_p6.png" alt="MDD Logo" class="logo-mobile">
    </div>

    <!-- Title -->
    <h2 class="title">Se connecter</h2>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <!-- Username/Email Field -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>E-mail ou nom d'utilisateur</mat-label>
        <input matInput formControlName="username" required>
        <mat-error *ngIf="loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched">
          Ce champ est requis.
        </mat-error>
      </mat-form-field>

      <!-- Password Field -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Mot de passe</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Toggle password visibility'" type="button">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
          Le mot de passe est requis.
        </mat-error>
      </mat-form-field>

      <!-- Submit Button -->
      <button mat-raised-button color="primary" type="submit" class="submit-button" [disabled]="loginForm.invalid || isSubmitting">
        <span *ngIf="!isSubmitting">Se connecter</span>
        <mat-spinner *ngIf="isSubmitting" diameter="24" color="accent"></mat-spinner>
      </button>

    </form>
  </div>
</div>
